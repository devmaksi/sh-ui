decisions:
  - id: DEC-04
    what: Registry persistence is a JSON file in application data, written by a Rust module.
    why: One readable file, no extra dependency, easy to test. plugin-store was rejected as surplus.
  - id: DEC-05
    what: Script selection uses the native Tauri file dialog plus an editable path field.
    why: A picker alone hides what the app will execute. The path must be visible and correctable.
  - id: DEC-06
    what: Scaffolding uses create-tauri-app with the React + TypeScript template.
    why: Official template carries the Linux build wiring a hand-built config would get wrong.
