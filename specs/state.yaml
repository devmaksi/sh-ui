decisions:
- id: DEC-01
  what: Tauri shell with a Rust process host. UI talks over IPC, never a socket.
  why: Local process control and /proc access without a listening port or a second
    daemon.
  ref: specs/adr/0001-tauri-shell-with-rust-host.md
- id: DEC-02
  what: Provisional scope epic e05 (local process host) was folded into e01 and e02.
  why: An epic that only builds plumbing delivers no value on its own. Launch lives
    in e01, stop and shutdown cleanup in e02.
- id: DEC-03
  what: Release order is e01 → e03 → e04 → e02 by WSJF.
  why: e01 is the tracer bullet. e03 and e04 are the product differentiator. e02 is
    table stakes but the largest job.
- id: DEC-04
  what: Registry persistence is a JSON file in application data, written by a Rust
    module.
  why: One readable file, no extra dependency, easy to test. plugin-store 2.5.0 tagged
    SUS and rejected.
- id: DEC-05
  what: Script selection uses the native Tauri file dialog plus an editable path field.
  why: A picker alone hides what the app will execute.
- id: DEC-06
  what: Scaffolding uses create-tauri-app with the React + TypeScript template.
  why: The official template carries Linux build wiring a hand-built config would
    get wrong.
- id: DEC-07
  what: Every run is spawned as a process-group leader with setsid, and stopping a
    run is killpg SIGTERM then SIGKILL after a two second grace.
  why: One call must reach every descendant of a script that forks. Walking /proc
    races with re-parenting.
  ref: specs/adr/0002-run-supervision-and-output-caps.md
- id: DEC-08
  what: The host executes the registered file directly. A file without the execute
    bit is refused with NotExecutable.
  why: Running sh <path> would execute something other than the file the user registered
    and would remove NotExecutable from the contract.
  ref: specs/adr/0002-run-supervision-and-output-caps.md
- id: DEC-09
  what: Output is capped at 8 KiB per event on the host and 2000 lines in the UI ring
    buffer, with dropped lines counted on screen.
  why: A fast-printing script must not grow the webview until the app stops responding.
  ref: specs/adr/0002-run-supervision-and-output-caps.md
- id: DEC-11
  what: Metric source is the procfs crate (0.18.0, tokio-rs). The host reads /proc
    through it; CPU% and tree-sum math stay in our metrics module.
  why: Linux-only product, mature maintained crate, Task::children() gives the descendant
    walk e03s02 needs. Hand-parsing /proc/<pid>/stat by field index is fragile across
    kernel versions; sysinfo is cross-platform weight we do not need. User confirmed
    the dependency on 2026-08-14.
- id: DEC-12
  what: CPU percent is percent of one core — Δ(utime+stime) ticks over Δwall seconds.
    A multi-threaded script may exceed 100%.
  why: Matches top/htop semantics. User chose option A on 2026-08-14.
- id: DEC-14
  what: GPU probe order is nvidia-smi → amd-smi → rocm-smi (legacy) → intel_gpu_top
    (only if it runs without root); otherwise an explicit unavailable state. Attribution
    is per-process VRAM intersected with the run process tree, plus device utilization
    max as context. Probed once per poller, cached for the run.
  why: nvidia-smi query-compute-apps is the only per-process source verified live
    on the dev machine; rocm-smi is deprecated; intel_gpu_top needs CAP_PERFMON which
    collides with the no-root constraint. User confirmed order and option A (VRAM
    + device util, no pmon per-process util) on 2026-08-14.
- id: DEC-13
  what: Tree RAM is the sum of RSS over the process tree. Shared pages count in each
    process.
  why: Matches ps semantics and the stated need. Pss via smaps_rollup deferred as
    heavier with no stated need. User chose option A on 2026-08-14.
- id: DEC-10
  what: A run starts in the directory that holds the script.
  why: Scripts read their sibling files by relative path. Inheriting the host CWD
    made the same script behave differently under cargo test and under npm run dev.
  ref: specs/adr/0002-run-supervision-and-output-caps.md
deviations:
- id: DEV-01
  what: Repository root commit bdbad15 landed directly on main during seed-conventions.
  why: guard-git read HEAD before git init ran, so the protected-branch check saw
    "unknown". See specs/bugs/BUG-20260814-01-guard-git-unborn-main.md
  resolution: Kept as the root commit. All later commits use kickoff-branch and land-branch.sh.
- id: DEV-02
  what: Worktrees are not used in this project. Feature branches are checked out in
    the primary checkout.
  why: guard-git reads the HEAD of its own directory, so commits made from a linked
    worktree are refused. See specs/bugs/BUG-20260814-02-guard-git-blocks-worktree-commits.md
  resolution: Re-enable worktrees when the hook resolves the target repository.
- id: DEV-03
  what: run-verification-gates.sh is not run in this project. The project gate is
    npm run preflight.
  why: The bundled golden suite tests the bigpowers repository itself and reports
    25 false failures here. See specs/bugs/BUG-20260814-03-golden-gates-not-portable.md
