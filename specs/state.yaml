decisions:
- id: DEC-01
  what: Tauri shell with a Rust process host. UI talks over IPC, never a socket.
  why: Local process control and /proc access without a listening port or a second
    daemon.
  ref: specs/adr/0001-tauri-shell-with-rust-host.md
- id: DEC-02
  what: Provisional scope epic e05 (local process host) was folded into e01 and e02.
  why: An epic that only builds plumbing delivers no value on its own. Launch lives
    in e01, stop and shutdown cleanup in e02.
- id: DEC-03
  what: Release order is e01 → e03 → e04 → e02 by WSJF.
  why: e01 is the tracer bullet. e03 and e04 are the product differentiator. e02 is
    table stakes but the largest job.
- id: DEC-04
  what: Registry persistence is a JSON file in application data, written by a Rust
    module.
  why: One readable file, no extra dependency, easy to test. plugin-store 2.5.0 tagged
    SUS and rejected.
- id: DEC-05
  what: Script selection uses the native Tauri file dialog plus an editable path field.
  why: A picker alone hides what the app will execute.
- id: DEC-06
  what: Scaffolding uses create-tauri-app with the React + TypeScript template.
  why: The official template carries Linux build wiring a hand-built config would
    get wrong.
deviations:
- id: DEV-01
  what: Repository root commit bdbad15 landed directly on main during seed-conventions.
  why: guard-git read HEAD before git init ran, so the protected-branch check saw
    "unknown". See specs/bugs/BUG-20260814-01-guard-git-unborn-main.md
  resolution: Kept as the root commit. All later commits use kickoff-branch and land-branch.sh.
- id: DEV-02
  what: Worktrees are not used in this project. Feature branches are checked out in the primary checkout.
  why: guard-git reads the HEAD of its own directory, so commits made from a linked worktree are refused. See specs/bugs/BUG-20260814-02-guard-git-blocks-worktree-commits.md
  resolution: Re-enable worktrees when the hook resolves the target repository.
- id: DEV-03
  what: run-verification-gates.sh is not run in this project. The project gate is npm run preflight.
  why: The bundled golden suite tests the bigpowers repository itself and reports 25 false failures here. See specs/bugs/BUG-20260814-03-golden-gates-not-portable.md
