known_findings:
- 'check-blind-spots: 3 MEDIUM sc-gap for e01s01-e01s03 — expected, no test files
  exist yet. They clear when SC tags land in test code.'
- 'ETXTBSY flake in cargo test: a script held open for writing cannot be exec''d.
  Source of the transient write handle is not traced. The host now retries 8 times
  at 25 ms and reports spawnFailed with the OS reason.'
- 'Fixed during e02s04: Metrics-after-Ended race — the poller could finish an iteration
  after Ended was emitted. watch_exit now sets finished, joins the poller, then emits
  Ended, so Ended is structurally the last event (c45ebc2).'
- 'Fixed during e02s04: process_tree_walk leaf-test race — /bin/sh (dash) forks external
  commands, so the old fixture pid was never childless; the test only passed when
  the walk beat the fork. Fixture now uses exec (4410a39).'
- 'Fixed during e02s04: specs/release-plan.yaml had wsjf: keys at 2-space indent,
